<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Drawer Menu (JS scroll lock + animation)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Arial, sans-serif; }

  .top_menu_menu-btn{
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1001;
    padding: 8px 12px;
    background: #111;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    border: none;
  }

  body.top_menu_no-scroll{ overflow: hidden; }

  .top_menu_drawer{
    position: fixed;
    top: 0; bottom: 0; left: 0; right: auto;
    width: 280px;
    background: #fff;
    box-shadow: 2px 0 18px rgba(0,0,0,.18);
    transform: translate3d(-110%, 0, 0);
    transition: transform .28s cubic-bezier(.2,.6,.2,1), opacity .28s;
    z-index: 1002;
    padding: 16px;
    overflow-y: auto;
    will-change: transform;
    border-radius: 0;
    opacity: 0;
  }

  .top_menu_overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s linear;
    z-index: 1000;
  }

  .top_menu_is-open .top_menu_drawer{
    transform: translate3d(0,0,0);
    opacity: 1;
  }
  .top_menu_is-open .top_menu_overlay{
    opacity: 1;
    pointer-events: auto;
  }

  @media (prefers-reduced-motion: reduce){
    .top_menu_drawer, .top_menu_overlay{ transition: none !important; }
  }

  @media (min-width: 768px){
    .top_menu_drawer{
      top: 40px;
      bottom: 40px;
      left: 40px;
      width: 320px;
      height: auto;
      border-radius: 12px;
      box-shadow: 8px 12px 32px rgba(0,0,0,.18);
      transform: translate3d(calc(-100% - 40px), 0, 0);
      opacity: 0;
    }
    .top_menu_is-open .top_menu_drawer{
      transform: translate3d(0,0,0);
      opacity: 1;
    }
  }

  main{ padding: 64px 16px 24px; line-height: 1.6; }
  .card{ max-width: 720px; margin: 0 auto 16px; background: #f7f7f9; border-radius: 12px; padding: 16px; }
</style>
</head>
<body>

<button class="top_menu_menu-btn" id="top_menu_button" aria-controls="top_menu_drawer" aria-expanded="false">☰ Menu</button>

<div class="top_menu_drawer-wrap" id="top_menu_drawerWrap">
  <nav id="top_menu_drawer" class="top_menu_drawer" aria-label="Side Menu" tabindex="-1">
    <h3>Navigation</h3>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Category</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>
  <div class="top_menu_overlay" id="top_menu_overlay" aria-hidden="true"></div>
</div>

<main>
  <div class="card">Content Area 1</div>
  <div class="card">Content Area 2</div>
  <div class="card">Content Area 3</div>
  <div class="card">Scroll to test…</div>
</main>

<script>
  const btn = document.getElementById('top_menu_button');
  const drawer = document.getElementById('top_menu_drawer');
  const overlay = document.getElementById('top_menu_overlay');
  const wrap = document.getElementById('top_menu_drawerWrap');
  let lastFocus = null;

  function openDrawer() {
    lastFocus = document.activeElement;
    document.body.classList.add('top_menu_no-scroll');
    wrap.classList.add('top_menu_is-open');
    btn.setAttribute('aria-expanded', 'true');
    requestAnimationFrame(() => drawer.focus());
  }

  function closeDrawer() {
    wrap.classList.remove('top_menu_is-open');
    btn.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('top_menu_no-scroll');
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
  }

  btn.addEventListener('click', () => {
    const open = wrap.classList.contains('top_menu_is-open');
    open ? closeDrawer() : openDrawer();
  });

  overlay.addEventListener('click', closeDrawer);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && wrap.classList.contains('top_menu_is-open')) closeDrawer();
  });

  drawer.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const focusables = drawer.querySelectorAll('a, button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];

    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  });
</script>

</body>
</html>
